<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TASKR — Do Things.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="brand">TASKR</div>
      <div class="tagline">Get things done. No excuses.</div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">☀️ Light mode</button>
    </header>

    <!-- Progress -->
    <div class="progress-wrap" id="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Task completion progress">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="progress-label" id="progress-label">0% complete</div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="stat-pending">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="stat-done">0</span>
        <span class="stat-label">Done</span>
      </div>
    </div>

    <!-- Input -->
    <div class="input-row">
      <input
        type="text"
        class="task-input"
        id="task-input"
        placeholder="What needs to be done?"
        maxlength="200"
        autocomplete="off"
      />
      <input
        type="date"
        class="task-due-input"
        id="task-due"
        title="Optional due date"
        aria-label="Optional due date"
      />
      <select class="priority-select" id="priority-select" aria-label="Task priority">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>
      <button class="add-btn" id="add-btn">ADD</button>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- Sort -->
    <div class="sort-row">
      <button class="filter-btn" id="sort-btn" type="button" aria-label="Toggle task sort order">Sort: Newest ↓</button>
    </div>

    <!-- Search -->
    <div class="search-row">
      <input
        type="text"
        class="task-input search-input"
        id="search-input"
        placeholder="Search tasks…"
        autocomplete="off"
        aria-label="Search tasks"
      />
    </div>

    <!-- Task List -->
    <div id="task-list"></div>

    <!-- Empty State -->
    <div id="empty-state">
      <span class="empty-icon">◻</span>
      <p>Nothing here yet.</p>
    </div>

    <!-- Undo toast: shown for a few seconds after a delete -->
    <div class="undo-toast" id="undo-toast" style="display:none" role="status">
      <span>Task deleted</span>
      <button class="undo-btn" id="undo-btn" type="button">Undo</button>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <span class="remaining-count" id="remaining-count"></span>
      <button class="clear-btn" id="clear-btn">Clear Completed</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
